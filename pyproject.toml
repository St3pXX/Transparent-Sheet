[project]
name = "transparent-sheet"
version = "0.1.0"
description = "Multi-agent virtual organization on Feishu Bitable"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.3.0",
    "aiosqlite>=0.20.0",
    "lark-oapi>=1.0.0",
    "streamlit>=1.38.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]
turso = [
    "libsql-client>=0.3.0",
]
all = [
    "transparent-sheet[postgres,turso]",
]

[tool.setuptools]
package-dir = {transparent_sheet = "."}
packages = ["transparent_sheet", "transparent_sheet.orchestration", "transparent_sheet.agents", "transparent_sheet.agents.tools", "transparent_sheet.datastore", "transparent_sheet.channels", "transparent_sheet.console", "transparent_sheet.feishu", "transparent_sheet.config", "transparent_sheet.api"]
